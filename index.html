<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC 文件站</title>
<style>
  :root {
    --bg: #0f1220; --card: rgba(22, 28, 45, 0.85); --border: rgba(255,255,255,0.08);
    --text: #e2e8f0; --meta: #94a3b8; --accent: #38bdf8; --accent2: #2563eb;
    --err: #f87171; --ok: #34d399; --warn: #fbbf24;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 15% 0%, #1e1b4b, transparent 40%), radial-gradient(circle at 85% 100%, #312e81, transparent 40%), var(--bg);
    color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  
  /* 顶部与独立大区 */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .title { font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
  .server-card {
    background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(37,99,235,0.1));
    border: 1px solid rgba(56,189,248,0.3); border-radius: 16px; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2); width: 100%; max-width: 380px;
  }
  .server-card span.addr { font-weight: 700; color: var(--accent); font-size: 16px; }
  .copy-btn {
    margin-left: auto; background: var(--accent); color: #000; border: none;
    padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer;
    transition: all 0.3s var(--ease);
  }
  .copy-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(56,189,248,0.5); }
  .copy-btn:active { transform: scale(0.95); }

  /* 卡片通用 */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 24px; margin-bottom: 24px; backdrop-filter: blur(16px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .card-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  
  /* 表单 */
  input, select {
    width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 12px;
    border: 1px solid var(--border); background: rgba(15,18,32,0.6); color: var(--text);
    font-size: 14px; outline: none; transition: all 0.3s var(--ease);
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
  input[type="file"] { padding: 8px; }
  
  .upload-btn {
    width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; cursor: pointer;
    transition: all 0.3s var(--ease); margin-top: 4px;
  }
  .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,0.4); }
  .upload-btn:active { transform: scale(0.97); }

  /* 进度与提示 */
  .bar-bg { height: 6px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width 0.4s var(--ease); }
  .msg { margin-top: 10px; font-size: 13px; min-height: 20px; }
  .err { color: var(--err); } .ok { color: var(--ok); } .warn { color: var(--warn); } .file-meta { color: var(--meta); font-size: 12px; }

  /* 列表 */
  .file-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--border); margin-bottom: 10px; transition: all 0.3s var(--ease);
  }
  .file-item:hover { background: rgba(255,255,255,0.06); transform: translateX(4px); }
  .file-info { display: flex; flex-direction: column; gap: 4px; }
  .file-actions { display: flex; gap: 8px; }
  .link-btn {
    padding: 6px 12px; border-radius: 8px; background: rgba(56,189,248,0.15); color: var(--accent);
    text-decoration: none; font-size: 13px; border: 1px solid rgba(56,189,248,0.3); transition: all 0.3s var(--ease);
  }
  .link-btn:hover { background: var(--accent); color: #000; }
  .btn-del {
    padding: 6px 12px; border-radius: 8px; background: rgba(248,113,113,0.15); color: var(--err);
    border: 1px solid rgba(248,113,113,0.3); cursor: pointer; transition: all 0.3s var(--ease);
  }
  .btn-del:hover { background: var(--err); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">📦 MC 文件站</div>
    <div class="server-card">
      <span>🖥️</span><span class="addr">mc.cross17.icu</span>
      <button class="copy-btn" onclick="copyServer()">复制</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🚀 直传区 (仅你可用)</div>
    <input id="pat" type="password" placeholder="GitHub Token (需勾选 repo)">
    <input id="file" type="file">
    <select id="cat">
      <option>启动器</option><option>整合包</option><option>模组</option><option>其他</option>
    </select>
    <input id="desc" placeholder="简介 (可选，如: pcl2)">
    <button class="upload-btn" onclick="upload()">⬆️ 直传仓库 (单文件限 100MB)</button>
    <div class="bar-bg"><div class="bar" id="bar"></div></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="card-title">📁 文件列表</div>
    <input id="q" placeholder="🔍 搜索文件...">
    <div id="list">加载中...</div>
  </div>
</div>

<script>
// 【已修正】实际仓库路径：chachacha1437god/mc-files，分支 main
const OWNER="chachacha1437god", REPO="mc-files", BRANCH="main", MAX=100 * 1024 * 1024;
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

function auth(t){return t?{'Authorization':`Bearer ${t}`,'Accept':'application/vnd.github+json'}:{'Accept':'application/vnd.github+json'}}
function pat(){return document.getElementById('pat').value.trim()}
function msg(t){document.getElementById('msg').innerHTML=t}
function busy(p){document.getElementById('bar').style.width=p+'%'}
function copyServer(){navigator.clipboard.writeText('mc.cross17.icu');msg('<span class="ok">✅ 服务器地址已复制</span>')}

async function render(){
  const list=document.getElementById('list'), q=document.getElementById('q').value.toLowerCase();
  list.innerHTML='加载中...';
  try{
    let meta={}; 
    try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`,{headers:auth(pat())}); if(r.ok)meta=JSON.parse(atob((await r.json()).content))}catch{}
    
    const r=await fetch(`${API}/contents?ref=${BRANCH}`,{headers:auth(pat())});
    if(!r.ok){
      if(r.status===404) throw new Error(`404: 仓库/路径不匹配 或 Token未勾选repo`);
      throw new Error(`加载失败：${r.status}`);
    }
    
    const files=await r.json();
    const filtered = files.filter(f=>(f.name.endsWith('.exe')||f.name.endsWith('.zip')||f.name.endsWith('.jar')) && (!q||f.name.toLowerCase().includes(q)));
    if(filtered.length===0){list.innerHTML='<span class="file-meta">无匹配文件</span>'; return}
    
    list.innerHTML = filtered.map(f=>{
      const m=meta[f.name]||{}; 
      return`<div class="file-item">
        <div class="file-info">
          <b>${f.name}</b> <span class="file-meta">(${(f.size/1024/1024).toFixed(1)}MB)</span><br>
          <span class="file-meta">${m.cat||'其他'} ${m.desc?'· '+m.desc:''}</span>
        </div>
        <div class="file-actions">
          <a href="${RAW}/${f.name}" target="_blank" class="link-btn">直链</a>
          <button class="btn-del" onclick="delFile('${f.name}','${f.sha}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){list.innerHTML=`<span class="err">❌ ${e.message}</span>`}
}

async function upload(){
  const file=document.getElementById('file').files[0], token=pat(), cat=document.getElementById('cat').value, desc=document.getElementById('desc').value; 
  if(!file)return msg('<span class="warn">⚠️ 请先选择文件</span>'); 
  if(!token)return msg('<span class="err">⚠️ 请填写 Token (需勾 repo)</span>');
  if(file.size>MAX)return msg('<span class="err">❌ 文件超 100MB，请分卷压缩</span>');
  
  msg('读取中...'); busy(20);
  const reader=new FileReader; 
  reader.onload=async()=>{
    const b64=reader.result.split(',')[1], safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    try{
      let sha=null; 
      try{const r=await fetch(`${API}/contents/${safe}?ref=${BRANCH}`,{headers:auth(token)}); if(r.ok)sha=(await r.json()).sha}catch{}
      msg('上传中...'); busy(60);
      
      // 记录简介到 meta
      let meta={}; 
      try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`,{headers:auth(token)}); if(r.ok)meta=JSON.parse(atob((await r.json()).content))}catch{}
      meta[safe]={cat, desc, time:Date.now()};
      const metaSha=null; try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`,{headers:auth(token)}); if(r.ok)metaSha=(await r.json()).sha}catch{}
      await fetch(`${API}/contents/.meta.json`,{method:'PUT', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify({message:'更新meta', content:btoa(unescape(encodeURIComponent(JSON.stringify(meta,null,2)))), sha:metaSha, branch:BRANCH})});
      
      const body={message:`上传 ${safe}`, content:b64, branch:BRANCH}; 
      if(sha)body.sha=sha;
      const up=await fetch(`${API}/contents/${safe}`,{method:'PUT', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(!up.ok){const err=await up.json().catch(()=>({message:up.status})); throw new Error(err.message||'上传失败');}
      msg('<span class="ok">✅ 上传成功！</span>'); busy(100); 
      setTimeout(()=>{busy(0); msg('');},1500); 
      render();
    }catch(e){msg(`<span class="err">❌ ${e.message}</span>`); busy(0)}
  }; 
  reader.readAsDataURL(file);
}

window.delFile=async(n,s)=>{
  if(!confirm('确定删除 '+n+' ?'))return; 
  await fetch(`${API}/contents/${n}`,{method:'DELETE', headers:{...auth(pat()),'Content-Type':'application/json'}, body:JSON.stringify({message:'删',sha:s,branch:BRANCH})}); 
  render()
};

document.getElementById('q').oninput=render; 
render();
</script>
</body>
</html>
