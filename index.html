<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC 文件站 - 直传中心</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: rgba(30, 41, 59, 0.7);
    --primary: #38bdf8;
    --primary-hover: #0ea5e9;
    --danger: #f87171;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
  }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 25%),
                      radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 2rem 1rem;
    max-width: 860px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  /* 顶部标题区 */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .title {
    font-size: 1.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    letter-spacing: 0.5px;
  }
  .btn-server {
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-server:hover {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
  }
  /* 玻璃拟态卡片 */
  .card {
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .card-title {
    font-size: 1.2rem;
    margin-bottom: 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  /* 表单控件 */
  input, select, textarea {
    width: 100%;
    padding: 0.8rem 1rem;
    margin-bottom: 0.8rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.6);
    color: var(--text);
    box-sizing: border-box;
    font-size: 0.95rem;
    transition: border 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
  }
  /* 文件选择美化 */
  input[type="file"] {
    padding: 0.6rem;
    background: rgba(255,255,255,0.03);
  }
  /* 按钮 */
  .btn-main {
    background: linear-gradient(135deg, var(--primary), #3b82f6);
    color: #fff;
    border: none;
    padding: 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    width: 100%;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-main:hover { box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4); }
  
  .btn-del {
    background: rgba(248, 113, 113, 0.1);
    color: var(--danger);
    border: 1px solid rgba(248, 113, 113, 0.3);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .btn-del:hover { background: var(--danger); color: #fff; }
  /* 进度条 */
  .progress-box {
    height: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 0.8rem;
  }
  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s;
  }
  /* 列表区 */
  .file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.8rem;
  }
  .file-info b { font-size: 1.05rem; }
  .file-meta { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.3rem; }
  .file-actions { display: flex; gap: 0.8rem; align-items: center; }
  .link-btn {
    color: var(--primary);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .msg { margin-top: 0.8rem; font-size: 0.9rem; }
  .ok { color: #34d399; }
  .err { color: var(--danger); }
  .search-box {
    margin-bottom: 1rem;
    background: rgba(255,255,255,0.05);
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">📦 MC 文件站</div>
  <button class="btn-server" onclick="copyServer()">📋 复制服务器: mc.cross17.icu</button>
</div>

<div class="card">
  <div class="card-title">🚀 直传区 (仅你可用)</div>
  <input id="pat" type="password" placeholder="填入 GitHub Token (需勾选 repo，仅存本机)">
  <input id="file" type="file">
  <select id="cat">
    <option>其他</option>
    <option>启动器</option>
    <option>整合包</option>
    <option>模组</option>
    <option>材质</option>
  </select>
  <input id="desc" placeholder="简介 (可选)">
  <button class="btn-main" onclick="upload()">⬆ 直传仓库 (单文件限 100MB)</button>
  <div class="progress-box"><div class="progress-bar" id="bar"></div></div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div class="card-title">📂 文件列表</div>
  <input id="q" class="search-box" placeholder="🔍 搜索文件...">
  <div id="list">加载中...</div>
</div>

<script>
const OWNER="Chacha1437God", REPO="mc-files", BRANCH="main", MAX=100 * 1024 * 1024;
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

function auth(t){return t?{'Authorization':`Bearer ${t}`,'Accept':'application/vnd.github+json'}:{'Accept':'application/vnd.github+json'}}
function pat(){return document.getElementById('pat').value.trim()}
function msg(t){document.getElementById('msg').innerHTML=t}
function busy(p){document.getElementById('bar').style.width=p+'%'}
function copyServer(){navigator.clipboard.writeText('mc.cross17.icu');msg('<span class="ok">✅ 服务器地址已复制</span>')}

async function render(){
  const list=document.getElementById('list'), q=document.getElementById('q').value.toLowerCase();
  list.innerHTML='<span style="color:#94a3b8">加载中...</span>';
  try{
    let meta={}; 
    try{
      const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`,{headers:auth(pat())}); 
      if(r.ok)meta=JSON.parse(atob((await r.json()).content))
    }catch{}
    const r=await fetch(`${API}/contents?ref=${BRANCH}`,{headers:auth(pat())});
    if(!r.ok)throw new Error(`加载失败：${r.status}`);
    const files=await r.json();
    
    const filtered = files.filter(f=>(f.name.endsWith('.exe')||f.name.endsWith('.zip')||f.name.endsWith('.jar')) && (!q||f.name.toLowerCase().includes(q)));
    if(filtered.length===0){list.innerHTML='无匹配文件'; return}
    
    list.innerHTML = filtered.map(f=>{
      const m=meta[f.name]||{}; 
      return`<div class="file-item">
        <div class="file-info">
          <b>${f.name}</b> <span class="file-meta">(${(f.size/1024/1024).toFixed(1)}MB)</span>
          <div class="file-meta">${m.cat||'其他'} ${m.desc?'· '+m.desc:''}</div>
        </div>
        <div class="file-actions">
          <a href="${RAW}/${f.name}" target="_blank" class="link-btn">直链下载</a>
          <button class="btn-del" onclick="delFile('${f.name}','${f.sha}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){list.innerHTML=`<span class="err">❌ ${e.message}</span>`}
}

async function upload(){
  const file=document.getElementById('file').files[0], token=pat(); 
  if(!file)return msg('⚠️ 请先选择文件'); 
  if(!token)return msg('<span class="err">⚠️ 请填写 Token</span>');
  if(file.size>MAX)return msg('<span class="err">❌ 文件超 100MB，请分卷压缩</span>');
  
  msg('读取中...'); busy(20);
  const reader=new FileReader; 
  reader.onload=async()=>{
    const b64=reader.result.split(',')[1], safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    try{
      let sha=null; 
      try{
        const r=await fetch(`${API}/contents/${safe}?ref=${BRANCH}`,{headers:auth(token)}); 
        if(r.ok)sha=(await r.json()).sha
      }catch{}
      msg('上传中...'); busy(60);
      const body={message:`上传 ${safe}`, content:b64, branch:BANCH=BRANCH}; if(sha)body.sha=sha;
      const up=await fetch(`${API}/contents/${safe}`,{method:'PUT', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(!up.ok)throw new Error((await up.json()).message||up.status);
      msg('<span class="ok">✅ 上传成功！</span>'); busy(100); setTimeout(()=>busy(0),800); render();
    }catch(e){msg(`<span class="err">❌ ${e.message}</span>`); busy(0)}
  }; 
  reader.readAsDataURL(file);
}

window.delFile=async(n,s)=>{
  if(!confirm('确定删除 '+n+' ?'))return; 
  await fetch(`${API}/contents/${n}`,{method:'DELETE', headers:{...auth(pat()),'Content-Type':'application/json'}, body:JSON.stringify({message:'删',sha:s,branch:BRANCH})}); 
  render()
};

document.getElementById('q').oninput=render; 
render();
</script>
</body>
</html>
