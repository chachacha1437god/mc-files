<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC 文件站 | 炫酷版</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.1);
    --primary: #00f2fe;
    --secondary: #4facfe;
    --text: #e2e8f0;
    --err: #ff4d4f;
    --ok: #00e676;
    --warn: #ffa726;
  }
  
  body {
    background: radial-gradient(circle at top left, #1a1a2e, var(--bg) 40%, #050505);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 30px 15px;
    max-width: 860px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* 顶部独立大区 */
  .header-area {
    margin-bottom: 30px;
    padding: 30px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(79, 172, 254, 0.15), rgba(0, 242, 254, 0.05));
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  
  .title-box {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  .title-box h1 {
    font-size: 32px;
    margin: 0;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0,242,254,0.3);
  }
  
  .icon-emoji { font-size: 36px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); }

  /* 丝滑按钮基础 */
  .btn {
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer;
    border: none;
    outline: none;
  }
  
  .btn:active { transform: scale(0.96); }
  
  .btn-copy {
    background: linear-gradient(45deg, var(--secondary), var(--primary));
    color: #000;
    font-weight: 800;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 16px;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    white-space: nowrap;
  }
  
  .btn-copy:hover {
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
    transform: translateY(-2px);
  }

  /* 卡片区域 */
  .card {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  
  .card-title {
    font-size: 20px;
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* 表单元素 */
  input, select, textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    color: #fff;
    font-size: 15px;
    box-sizing: border-box;
    transition: border 0.3s, box-shadow 0.3s;
  }
  
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(0,242,254,0.2);
    outline: none;
  }

  input[type="file"] { padding: 10px; background: transparent; }
  
  .btn-upload {
    width: 100%;
    background: linear-gradient(45deg, #00f2fe, #4facfe);
    color: #000;
    font-weight: bold;
    padding: 16px;
    border-radius: 12px;
    font-size: 17px;
    margin-top: 5px;
  }
  
  .btn-upload:hover {
    filter: brightness(1.1);
    box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
    transform: translateY(-2px);
  }

  /* 进度条与状态 */
  .progress {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 15px;
  }
  
  .bar {
    height: 100%;
    background: linear-gradient(90deg, var(--secondary), var(--primary));
    width: 0;
    transition: width 0.4s ease;
    box-shadow: 0 0 10px var(--primary);
  }

  .msg { font-size: 14px; margin-top: 12px; line-height: 1.5; }
  .ok { color: var(--ok); text-shadow: 0 0 8px rgba(0,230,118,0.3); }
  .err { color: var(--err); text-shadow: 0 0 8px rgba(255,77,79,0.3); }
  .warn { color: var(--warn); }

  /* 文件列表 */
  .file-item {
    background: rgba(0,0,0,0.2);
    padding: 18px;
    border-radius: 14px;
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid rgba(255,255,255,0.05);
    transition: transform 0.2s;
  }
  
  .file-item:hover { transform: translateX(4px); border-color: rgba(0,242,254,0.3); }
  
  .file-info b { font-size: 16px; color: #fff; }
  .file-meta { font-size: 13px; color: #94a3b8; margin-top: 4px; display: block; }
  
  .file-actions { display: flex; gap: 10px; }
  .link-btn {
    background: rgba(255,255,255,0.1);
    padding: 8px 14px;
    border-radius: 8px;
    color: var(--primary);
    text-decoration: none;
    font-size: 13px;
    transition: all 0.2s;
  }
  .link-btn:hover { background: rgba(0,242,254,0.2); }
  
  .btn-del {
    background: rgba(255,77,79,0.1);
    color: var(--err);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid rgba(255,77,79,0.3);
  }
  .btn-del:hover { background: var(--err); color: #fff; }

  @media (max-width: 600px) {
    .header-area { flex-direction: column; gap: 20px; text-align: center; }
    .btn-copy { width: 100%; }
  }
</style>
</head>
<body>

<!-- 复制服务器独占大区 -->
<div class="header-area">
  <div class="title-box">
    <span class="icon-emoji">📦</span>
    <h1>MC 文件站</h1>
  </div>
  <button class="btn btn-copy" onclick="copyServer()">📋 复制服务器: mc.cross17.icu</button>
</div>

<!-- 直传区 -->
<div class="card">
  <h3 class="card-title">🚀 直传区 (仅你可用)</h3>
  <input id="pat" type="password" placeholder="GitHub Token (需勾选 repo，仅存本机)" value="">
  <input id="file" type="file">
  <select id="cat">
    <option>其他</option><option>启动器</option><option>整合包</option><option>模组</option><option>材质</option>
  </select>
  <input id="desc" placeholder="简介 (可选，如: pcl2)">
  <button id="upBtn" class="btn btn-upload" onclick="upload()">⬆ 直传仓库 (单文件限 100MB)</button>
  <div id="msg" class="msg"></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

<!-- 文件列表区 -->
<div class="card">
  <h3 class="card-title">📁 文件列表</h3>
  <input id="q" placeholder="🔍 搜索文件...">
  <div id="list"></div>
</div>

<script>
const OWNER="Chacha1437God", REPO="mc-files", BRANCH="main", MAX=100 * 1024 * 1024;
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

function auth(t){return t?{'Authorization':`Bearer ${t}`,'Accept':'application/vnd.github+json'}:{'Accept':'application/vnd.github+json'}}
function pat(){return document.getElementById('pat').value.trim()}
function msg(t){document.getElementById('msg').innerHTML=t}
function busy(p){document.getElementById('bar').style.width=p+'%'}

function copyServer(){
  navigator.clipboard.writeText('mc.cross17.icu');
  msg('<span class="ok">✅ 服务器地址已复制</span>');
  setTimeout(()=>msg(''), 2000);
}

async function render(){
  const list=document.getElementById('list'), q=document.getElementById('q').value.toLowerCase();
  list.innerHTML='<span class="file-meta">加载中...</span>';
  try{
    let meta={}; 
    try{
      const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`,{headers:auth(pat())}); 
      if(r.ok)meta=JSON.parse(atob((await r.json()).content))
    }catch{}
    
    const r=await fetch(`${API}/contents?ref=${BRANCH}`,{headers:auth(pat())});
    if(!r.ok){
      if(r.status===404) throw new Error(`404: 仓库不存在 / Token未勾选repo / 分支非main`);
      throw new Error(`加载失败：${r.status}`);
    }
    
    const files=await r.json();
    const filtered = files.filter(f=>(f.name.endsWith('.exe')||f.name.endsWith('.zip')||f.name.endsWith('.jar')) && (!q||f.name.toLowerCase().includes(q)));
    
    if(filtered.length===0){
      list.innerHTML='<span class="file-meta">无匹配文件</span>'; 
      return;
    }
    
    list.innerHTML = filtered.map(f=>{
      const m=meta[f.name]||{}; 
      return`<div class="file-item">
        <div class="file-info">
          <b>${f.name}</b> <span class="file-meta">(${(f.size/1024/1024).toFixed(1)}MB)</span>
          <span class="file-meta">${m.cat||'其他'} ${m.desc?'· '+m.desc:''}</span>
        </div>
        <div class="file-actions">
          <a href="${RAW}/${f.name}" target="_blank" class="link-btn">直链</a>
          <button class="btn-del" onclick="delFile('${f.name}','${f.sha}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    list.innerHTML=`<span class="err">❌ ${e.message}</span>`
  }
}

async function upload(){
  const file=document.getElementById('file').files[0], token=pat(); 
  if(!file)return msg('<span class="warn">⚠️ 请先选择文件</span>'); 
  if(!token)return msg('<span class="err">⚠️ 请填写 Token (需勾 repo)</span>');
  if(file.size>MAX)return msg('<span class="err">❌ 文件超 100MB，请分卷压缩</span>');
  
  msg('读取中...'); busy(20);
  const reader=new FileReader; 
  reader.onload=async()=>{
    const b64=reader.result.split(',')[1], safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    try{
      let sha=null; 
      try{
        const r=await fetch(`${API}/contents/${safe}?ref=${BRANCH}`,{headers:auth(token)}); 
        if(r.ok)sha=(await r.json()).sha
      }catch{}
      msg('上传中...'); busy(60);
      const body={message:`上传 ${safe}`, content:b64, branch:BRANCH}; 
      if(sha)body.sha=sha;
      const up=await fetch(`${API}/contents/${safe}`,{method:'PUT', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(!up.ok){
        const err=await up.json().catch(()=>({message:up.status}));
        throw new Error(err.message||'上传失败');
      }
      msg('<span class="ok">✅ 上传成功！</span>'); busy(100); 
      setTimeout(()=>{busy(0); msg('');}, 1500); 
      render();
    }catch(e){
      msg(`<span class="err">❌ ${e.message}</span>`); busy(0)
    }
  }; 
  reader.readAsDataURL(file);
}

window.delFile=async(n,s)=>{
  if(!confirm('确定删除 '+n+' ?'))return; 
  await fetch(`${API}/contents/${n}`,{method:'DELETE', headers:{...auth(pat()),'Content-Type':'application/json'}, body:JSON.stringify({message:'删',sha:s,branch:BRANCH})}); 
  render()
};

document.getElementById('q').oninput=render; 
render();
</script>
</body>
</html>
