<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC 文件仓库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Minecraftia&display=swap');
:root{
  --stone:#7C7C7C; --stone-dark:#5C5C5C; --stone-light:#9C9C9C;
  --grass:#5BBA46; --grass-dark:#3E8E2E; --sky:#80C8FF;
  --gold:#F2C94C; --gold-dark:#D4A017; --text:#FFFFFF; --text-dark:#333;
}
*{box-sizing:border-box; margin:0; padding:0; user-select:none;}
body{
  font-family:'Minecraftia', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background:linear-gradient(to bottom, var(--sky) 0%, var(--sky) 60%, var(--grass) 60%, var(--grass-dark) 100%);
  background-attachment:fixed; color:var(--text); min-height:100vh; padding:20px;
}
.container{max-width:800px; margin:0 auto;}
/* 石质面板 */
.panel{
  background:var(--stone); border:4px solid #000;
  box-shadow:inset 4px 4px 0 var(--stone-light), inset -4px -4px 0 var(--stone-dark), 6px 6px 0 #000;
  padding:16px; margin-bottom:20px;
}
h1{font-size:24px; text-shadow:2px 2px 0 #000; margin-bottom:12px; display:flex; align-items:center; gap:10px;}
h2{font-size:18px; text-shadow:2px 2px 0 #000; margin-bottom:12px;}
/* 草方块区 */
.grass-panel{
  background:var(--grass); border:4px solid #000;
  box-shadow:inset 4px 4px 0 #7ED96A, inset -4px -4px 0 var(--grass-dark), 6px 6px 0 #000;
  padding:20px; text-align:center; margin-bottom:20px;
}
.server-addr{font-size:28px; text-shadow:2px 2px 0 #000; margin-bottom:12px; word-break:break-all;}
/* 按钮 */
.btn{
  font-family:inherit; font-size:14px; color:#000; cursor:pointer;
  background:var(--stone); border:4px solid #000; padding:8px 12px;
  box-shadow:inset 3px 3px 0 var(--stone-light), inset -3px -3px 0 var(--stone-dark), 4px 4px 0 #000;
  transition:none; text-decoration:none; display:inline-block;
}
.btn:active{
  box-shadow:inset 4px 4px 0 var(--stone-dark), inset -2px -2px 0 var(--stone-light), 0 0 0 #000;
  transform:translate(4px, 4px);
}
.btn-gold{background:var(--gold); box-shadow:inset 3px 3px 0 #FFE066, inset -3px -3px 0 var(--gold-dark), 4px 4px 0 #000;}
.btn-gold:active{box-shadow:inset 4px 4px 0 var(--gold-dark), inset -2px -2px 0 #FFE066, 0 0 0 #000;}
.btn-sm{padding:4px 8px; font-size:12px;}
.btn-danger{background:#E06C6C; box-shadow:inset 3px 3px 0 #FF8A8A, inset -3px -3px 0 #B84A4A, 4px 4px 0 #000;}
/* 输入 */
input, select, textarea{
  font-family:inherit; font-size:14px; color:#000; background:#FFF;
  border:4px solid #000; padding:8px; width:100%; margin-bottom:10px; outline:none;
}
input:focus, select:focus, textarea:focus{background:#FFE; user-select:text;}
.row{display:flex; gap:10px; margin-bottom:10px;}
.row>div{flex:1;}
/* 文件列表 */
.file-item{
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(0,0,0,0.2); border:2px solid #000; padding:10px; margin-bottom:8px;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,0.1), inset -2px -2px 0 rgba(0,0,0,0.3);
}
.file-name{font-size:16px; text-shadow:1px 1px 0 #000;}
.file-meta{font-size:12px; opacity:0.9; margin-top:4px;}
.file-actions{display:flex; gap:8px; align-items:center;}
a.link{color:var(--gold); text-shadow:1px 1px 0 #000; text-decoration:none;}
.progress{height:8px; background:#000; margin-top:8px; border:2px solid #000;}
.progress-bar{height:100%; background:var(--grass); width:0%; transition:width 0.1s;}
/* Toast 提示 */
#toast-box{position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--stone); border:4px solid #000; color:#000;
  box-shadow:inset 3px 3px 0 var(--stone-light), inset -3px -3px 0 var(--stone-dark), 4px 4px 0 #000;
  padding:10px 16px; font-size:14px; animation:slideIn 0.2s steps(3) forwards; min-width:160px;
}
.toast.warn{background:#E0A060; box-shadow:inset 3px 3px 0 #FFC080, inset -3px -3px 0 #B07030, 4px 4px 0 #000;}
.toast.err{background:#E06C6C; box-shadow:inset 3px 3px 0 #FF8A8A, inset -3px -3px 0 #B84A4A, 4px 4px 0 #000;}
.toast.ok{background:var(--grass); box-shadow:inset 3px 3px 0 #7ED96A, inset -3px -3px 0 var(--grass-dark), 4px 4px 0 #000;}
@keyframes slideIn{from{transform:translateX(120%);}to{transform:translateX(0);}}
@keyframes fadeOut{to{opacity:0; transform:translateX(120%);}}
.toast.hide{animation:fadeOut 0.2s steps(3) forwards;}
.search{margin-bottom:12px;}
.tag{display:inline-block; background:rgba(0,0,0,0.3); padding:2px 6px; font-size:12px; margin-right:4px;}
</style>
</head>
<body>
<div class="container">
  <!-- 服务器 -->
  <div class="grass-panel">
    <div class="server-addr" id="svr-addr">mc.cross17.icu</div>
    <button class="btn btn-gold" onclick="copySvr()">📋 复制地址</button>
  </div>

  <div class="panel">
    <h1>📁 文件列表</h1>
    <div class="search"><input type="text" id="q" placeholder="🔍 搜索文件..."></div>
    <div id="list">加载中...</div>
  </div>

  <div class="panel">
    <h2>⬆️ 上传文件 (≤100MB)</h2>
    <input type="file" id="file">
    <div class="row">
      <div><select id="cat"><option>启动器</option><option>整合包</option><option>模组</option><option>地图</option><option>材质</option><option>其他</option></select></div>
      <div><input type="text" id="desc" placeholder="简介 (如: pcl2)"></div>
    </div>
    <input type="password" id="token" placeholder="GitHub Token (需勾选 repo，仅本地保存)">
    <button class="btn" onclick="upload()">🚀 上传</button>
    <div class="progress"><div class="progress-bar" id="busy"></div></div>
    <div id="msg" style="margin-top:8px;font-size:12px;"></div>
  </div>
</div>

<div id="toast-box"></div>

<script>
const REPO='chachacha1437god/mc-files', BRANCH='main', API=`https://api.github.com/repos/${REPO}/contents`, RAW=`https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
const MAX=100 * 1024 * 1024;

// Toast 提示系统 (替代所有 alert/confirm)
function toast(t, c=''){
  const box=document.getElementById('toast-box');
  const el=document.createElement('div');
  el.className=`toast ${c}`; el.innerHTML=t;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('hide'); setTimeout(()=>el.remove(), 300);}, 2500);
}
function confirmToast(t, onYes){
  const box=document.getElementById('toast-box');
  const el=document.createElement('div');
  el.className='toast warn';
  el.innerHTML=`<div style="margin-bottom:8px">⚠️ ${t}</div><button class="btn btn-sm" onclick="yes()">确认</button> <button class="btn btn-sm" onclick="no()">取消</button>`;
  box.appendChild(el);
  function yes(){onYes(); el.classList.add('hide'); setTimeout(()=>el.remove(), 200);}
  function no(){el.classList.add('hide'); setTimeout(()=>el.remove(), 200);}
}

// 复制服务器
async function copySvr(){
  try{
    await navigator.clipboard.writeText('mc.cross17.icu');
    toast('✓ 已复制', 'ok');
  }catch(e){
    // 兼容旧浏览器
    const ta=document.createElement('textarea'); ta.value='mc.cross17.icu'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast('✓ 已复制', 'ok');
  }
}

// 编码修复 (UTF-8)
const utoa=s=>new TextEncoder().encode(s), atou=b=>new TextDecoder().decode(b);
const b64e=b=>btoa(String.fromCharCode(...b)), b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function getMeta(){
  try{const r=await fetch(`${API}/.meta.json?ref=${BRANCH}`); if(!r.ok)return{}; return JSON.parse(atou(b64d((await r.json()).content)));}catch{return{}}
}
async function setMeta(m, t){
  let ms=null; try{const r=await fetch(`${API}/.meta.json?ref=${BRANCH}`); if(r.ok)ms=(await r.json()).sha}catch{}
  await fetch(`${API}/.meta.json`,{method:'PUT',headers:auth(t),body:JSON.stringify({message:'meta',content:b64e(utoa(JSON.stringify(m,null,2))),sha:ms,branch:BRANCH})});
}
const auth=t=>({'Authorization':`token ${t}`,'Content-Type':'application/json'});
const pat=()=>document.getElementById('token').value.trim();

async function render(){
  const list=document.getElementById('list'), q=document.getElementById('q').value.toLowerCase();
  try{
    const [tree, meta]=await Promise.all([fetch(`${API}?ref=${BRANCH}`).then(r=>r.json()), getMeta()]);
    const files=tree.filter(f=>f.type==='file' && f.name!=='.meta.json' && f.size>0)
      .sort((a,b)=>b.size-a.size)
      .filter(f=>f.name.toLowerCase().includes(q));
    list.innerHTML=files.length?files.map(f=>{
      const m=meta[f.name]||{};
      return`<div class="file-item">
        <div><div class="file-name">📦 ${f.name}</div><div class="file-meta">${(f.size/1024/1024).toFixed(1)}MB · ${m.cat||'其他'}${m.desc?` · ${m.desc}`:''}</div></div>
        <div class="file-actions">
          <a class="link" href="${RAW}/${f.name}" target="_blank">直链</a>
          <button class="btn btn-danger btn-sm" onclick="delFile('${f.name}','${f.sha}')">删</button>
        </div></div>`;
    }).join(''):'<div style="opacity:.7">无匹配文件</div>';
  }catch(e){list.innerHTML=`<span style="color:#E06C6C">❌ ${e.message}</span>`}
}

async function upload(){
  const file=document.getElementById('file').files[0], t=pat(), cat=document.getElementById('cat').value, desc=document.getElementById('desc').value;
  if(!file)return toast('⚠️ 请选择文件','warn');
  if(!t)return toast('⚠️ 请填 Token','warn');
  if(file.size>MAX)return toast('❌ 超100MB，请分卷','err');
  if(file.size===0)return toast('❌ 空文件已拦截','err');
  
  toast('读取中...','warn'); busy(20);
  const reader=new FileReader;
  reader.onload=async()=>{
    const b64=reader.result.split(',')[1], safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    try{
      let sha=null;
      try{const r=await fetch(`${API}/${safe}?ref=${BRANCH}`); if(r.ok)sha=(await r.json()).sha}catch{}
      toast('上传中...','warn'); busy(60);
      const up=await fetch(`${API}/${safe}`,{method:'PUT',headers:auth(t),body:JSON.stringify({message:`上传 ${safe}`,content:b64,branch:BRANCH,sha})});
      if(!up.ok){const e=await up.json().catch(()=>({message:up.status}));throw new Error(e.message||'上传失败')}
      // 异步写meta
      try{let m=await getMeta(); m[safe]={cat,desc,time:Date.now()}; await setMeta(m,t);}catch{}
      toast('✅ 上传成功！','ok'); busy(100); setTimeout(()=>busy(0),800); render();
    }catch(e){
      toast(`❌ ${e.message.includes('Failed to fetch')?'网络请求失败，请检查代理':e.message}`,'err'); busy(0);
    }
  };
  reader.readAsDataURL(file);
}

window.delFile=(n,s)=>{
  confirmToast(`确定删除 ${n}?`, async()=>{
    toast('删除中...','warn');
    await fetch(`${API}/${n}`,{method:'DELETE',headers:auth(pat()),body:JSON.stringify({message:'删',sha:s,branch:BRANCH})});
    try{let m=await getMeta(); delete m[n]; await setMeta(m,pat());}catch{}
    toast('✓ 已删除','ok'); render();
  });
};

const busy=p=>document.getElementById('busy').style.width=p+'%';
document.getElementById('q').oninput=render; render();
</script>
</body>
</html>
