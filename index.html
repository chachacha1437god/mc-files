<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>MC 文件站</title>
<style>
  :root{--bg:#0b0f19;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--blue:#38bdf8;}
  body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#0b0f19,#1a103d);color:#e2e8f0;min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;padding:20px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .logo{font-size:24px;font-weight:700;}
  .server-box{background:linear-gradient(90deg,#1e293b,#0f172a);border:1px solid var(--bd);padding:12px 16px;border-radius:14px;text-align:center;margin-bottom:20px;}
  .server-box button{background:var(--blue);border:none;padding:10px 14px;border-radius:10px;color:#000;font-weight:700;cursor:pointer;transition:.25s;}
  .server-box button:active{transform:scale(.96)}
  .card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;}
  h2{margin:0 0 12px;font-size:18px;}
  input,select,textarea{width:100%;padding:10px;margin-bottom:10px;background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;color:#fff;}
  .up-btn{background:linear-gradient(90deg,#38bdf8,#6366f1);color:#fff;border:none;width:100%;padding:14px;border-radius:12px;font-size:16px;cursor:pointer;transition:.25s;}
  .up-btn:active{transform:scale(.98)}
  .file-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--bd);}
  .file-actions a,.file-actions button{margin-left:8px;padding:6px 10px;border-radius:8px;}
  .err{color:#f87171}.ok{color:#34d399}.warn{color:#fbbf24}
  #busy{height:6px;background:var(--blue);width:0;transition:.3s;border-radius:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">📦 MC 文件站</div></div>
  <div class="server-box">
    <div>服务器地址：<b>mc.cross17.icu</b></div>
    <button onclick="navigator.clipboard.writeText('mc.cross17.icu');this.innerText='已复制!'">复制服务器</button>
  </div>

  <div class="card">
    <h2>🚀 直传区 (仅你可用)</h2>
    <input id="token" type="password" placeholder="GitHub Token (需勾选 repo)">
    <input id="file" type="file" accept=".exe,.zip,.jar">
    <select id="cat"><option>启动器</option><option>整合包</option><option>模组</option><option>其他</option></select>
    <input id="desc" placeholder="简介 (可选)">
    <button class="up-btn" onclick="upload()">⬆ 直传仓库 (单文件限100MB)</button>
    <div id="busy"></div>
    <div id="msg" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <h2>📁 文件列表</h2>
    <input id="q" placeholder="🔍 搜索文件...">
    <div id="list">加载中...</div>
  </div>
</div>

<script>
const OWNER="chachacha1437god", REPO="mc-files", BRANCH="main";
const API=`https://api.github.com/repos/${OWNER}/${REPO}`, RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const MAX=100 * 1024 * 1024;
const pat=()=>document.getElementById('token').value.trim();
const auth=t=>({'Authorization':`token ${t}`,'Content-Type':'application/json'});

async function render(){
  const list=document.getElementById('list'), q=document.getElementById('q').value.toLowerCase();
  list.innerHTML='加载中...';
  try{
    let meta={};
    try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`); if(r.ok)meta=JSON.parse(atob((await r.json()).content))}catch{}
    const r=await fetch(`${API}/contents?ref=${BRANCH}`);
    if(!r.ok){if(r.status===404)throw new Error('404: 仓库/分支不对 或 Token未勾repo'); throw new Error('加载失败:'+r.status);}
    const files=(await r.json()).filter(f=>(f.name.endsWith('.exe')||f.name.endsWith('.zip')||f.name.endsWith('.jar'))&&(!q||f.name.toLowerCase().includes(q)));
    list.innerHTML=files.length?files.map(f=>{
      const m=meta[f.name]||{};
      return`<div class="file-item"><div><b>${f.name}</b> <span style="opacity:.6">(${(f.size/1024/1024).toFixed(1)}MB)</span><br><span style="opacity:.6;font-size:12px">${m.cat||'其他'}${m.desc?` · ${m.desc}`:''}</span></div><div class="file-actions"><a href="${RAW}/${f.name}" target="_blank">直链</a><button onclick="delFile('${f.name}','${f.sha}')">删</button></div></div>`;
    }).join(''):'<span style="opacity:.6">无匹配文件</span>';
  }catch(e){list.innerHTML=`<span class="err">❌ ${e.message}</span>`}
}

async function upload(){
  const file=document.getElementById('file').files[0], t=pat(), cat=document.getElementById('cat').value, desc=document.getElementById('desc').value;
  if(!file)return msg('⚠️ 请选择文件','warn');
  if(!t)return msg('⚠️ 请填 Token','warn');
  if(file.size>MAX)return msg('❌ 超100MB，请分卷','err');
  msg('读取中...','warn'); busy(20);
  const reader=new FileReader;
  reader.onload=async()=>{
    const b64=reader.result.split(',')[1], safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    try{
      let sha=null;
      try{const r=await fetch(`${API}/contents/${safe}?ref=${BRANCH}`); if(r.ok)sha=(await r.json()).sha}catch{}
      msg('上传中 (若卡住请检查网络/代理)...','warn'); busy(60);
      const up=await fetch(`${API}/contents/${safe}`,{method:'PUT',headers:auth(t),body:JSON.stringify({message:`上传 ${safe}`,content:b64,branch:BRANCH,sha})});
      if(!up.ok){const e=await up.json().catch(()=>({message:up.status}));throw new Error(e.message||'上传失败');}
      // 异步写meta，不阻塞
      try{let m={};try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`);if(r.ok)m=JSON.parse(atob((await r.json()).content))}catch{}
        m[safe]={cat,desc,time:Date.now()};let ms=null;try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`);if(r.ok)ms=(await r.json()).sha}catch{}
        await fetch(`${API}/contents/.meta.json`,{method:'PUT',headers:auth(t),body:JSON.stringify({message:'meta',content:btoa(unescape(encodeURIComponent(JSON.stringify(m,null,2)))),sha:ms,branch:BRANCH})});
      }catch{}
      msg('✅ 上传成功！','ok'); busy(100); setTimeout(()=>busy(0),800); render();
    }catch(e){
      msg(`❌ ${e.message.includes('Failed to fetch')?'网络请求失败，请检查代理/网络':e.message}`,'err'); busy(0);
    }
  };
  reader.readAsDataURL(file);
}

window.delFile=async(n,s)=>{if(confirm('删 '+n+'?')){await fetch(`${API}/contents/${n}`,{method:'DELETE',headers:auth(pat()),body:JSON.stringify({message:'删',sha:s,branch:BRANCH})});render()}};
const msg=(t,c)=>{const el=document.getElementById('msg');el.innerHTML=t;el.className=c||''};
const busy=p=>document.getElementById('busy').style.width=p+'%';
document.getElementById('q').oninput=render; render();
</script>
</body>
</html>
