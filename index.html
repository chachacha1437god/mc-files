<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC 文件直传与下载</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--pri:#38bdf8;--ok:#22c55e;--err:#ef4444}
  body{background:var(--bg);color:#e2e8f0;font-family:system-ui,sans-serif;margin:0;padding:20px;max-width:900px;margin:auto}
  h1{margin:0 0 10px;font-size:24px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  .ip-btn{background:var(--pri);color:#000;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold}
  .box{background:var(--card);padding:16px;border-radius:12px;margin-bottom:20px;box-shadow:0 4px 6px #00000033}
  input,select,button,textarea{font-family:inherit}
  input[type=file],input[type=text],select,textarea{width:100%;padding:8px;margin:6px 0;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}
  button{background:var(--pri);color:#000;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:8px}
  button:disabled{opacity:.5}
  .card{background:var(--card);padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .meta{font-size:13px;color:#94a3b8}
  .actions a, .actions button{margin-left:8px;color:var(--pri);text-decoration:none;background:none;border:none;padding:0;cursor:pointer;font-weight:normal}
  .actions .del{color:var(--err)}
  .msg{margin-top:8px;font-size:14px}
  .ok{color:var(--ok)} .err{color:var(--err)}
  #busy{height:4px;background:#334155;border-radius:2px;margin-top:8px;overflow:hidden}
  #busy::after{content:'';display:block;height:100%;width:var(--p,0%);background:var(--pri);transition:.3s}
  .hide{display:none}
</style>
</head>
<body>
  <div class="top">
    <h1>📦 MC 文件站</h1>
    <button class="ip-btn" onclick="copyIp()">📋 复制服务器: mc.cross17.icu</button>
  </div>

  <div class="box" id="adminBox">
    <b>🚀 直传区（仅你可用）</b><br>
    <input type="password" id="pat" placeholder="GitHub Token（只勾 repo，仅存本机）"><br>
    <input type="file" id="file"><br>
    <select id="cat"><option value="整合包">整合包</option><option value="模组">模组</option><option value="资源包">资源包</option><option value="其他">其他</option></select>
    <input type="text" id="desc" placeholder="简介（可选）">
    <button id="upBtn" onclick="upload()">⬆ 直传仓库</button>
    <div id="busy"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="box">
    <input type="text" id="q" placeholder="🔍 搜索文件...">
    <div id="list">加载中...</div>
  </div>

<script>
const OWNER='Chacha1437God', REPO='mc-files', BRANCH='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const MAX=100 * 1024 * 1024; // GitHub单文件100MB上限

function auth(t){return {'Authorization':'token '+t,'Accept':'application/vnd.github.v3+json'}}
function pat(){return document.getElementById('pat').value.trim()}
function msg(m){document.getElementById('msg').innerHTML=m}
function busy(p){document.getElementById('busy').style.setProperty('--p',p+'%')}
function copyIp(){navigator.clipboard.writeText('mc.cross17.icu');msg('<span class="ok">✅ 服务器地址已复制</span>')}

async function render(){
  const list=document.getElementById('list'), q=document.getElementById('q').value.toLowerCase();
  list.innerHTML='加载中...';
  try{
    let meta={}; try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`); if(r.ok)meta=JSON.parse(atob((await r.json()).content))}catch{}
    const res=await fetch(`${API}/contents?ref=${BRANCH}`);
    if(!res.ok)throw new Error(res.status);
    let files=(await res.json()).filter(f=>f.type==='file'&&f.name!=='.meta.json');
    files.sort((a,b)=>b.size-a.size);
    list.innerHTML='';
    files.forEach(f=>{
      const m=meta[f.name]||{};
      if(q&&!(f.name.toLowerCase().includes(q)||(m.desc||'').includes(q)||(m.cat||'').includes(q)))return;
      const size=(f.size/1024/1024).toFixed(2)+' MB';
      list.innerHTML+=`<div class="card">
        <div><b>${f.name}</b> <span class="meta">${m.cat||''} · ${size}</span><br><span class="meta">${m.desc||''}</span></div>
        <div class="actions">
          <a href="${RAW}/${encodeURIComponent(f.name)}" target="_blank">下载</a>
          <a href="https://ghproxy.com/${RAW}/${encodeURIComponent(f.name)}" target="_blank">镜像</a>
          <a href="#" onclick="copyLink('${RAW}/${encodeURIComponent(f.name)}')">复制直链</a>
          <button onclick="delFile('${f.name}','${f.sha}')" class="del">删除</button>
        </div></div>`;
    });
  }catch(e){list.innerHTML='<span class="err">加载失败：'+e.message+'</span>'}
}
window.copyLink=url=>{navigator.clipboard.writeText(url);msg('<span class="ok">✅ 直链已复制</span>')};

async function upload(){
  const btn=document.getElementById('upBtn'), file=document.getElementById('file').files[0];
  if(!file){msg('<span class="err">选个文件</span>');return}
  if(file.size>MAX){msg(`<span class="err">❌ 超 100MB 上限，请分卷</span>`);return}
  const token=pat(); if(!token){msg('<span class="err">填 Token</span>');return}
  btn.disabled=true; busy(0); msg('读取中...');
  const reader=new FileReader; reader.onload=async()=>{
    const b64=reader.result.split(',')[1], safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    try{
      let sha=null; try{const r=await fetch(`${API}/contents/${encodeURIComponent(safe)}`,{headers:auth(token)}); if(r.ok)sha=(await r.json()).sha}catch{}
      msg('上传中...'); busy(50);
      const body={message:`📦 上传 ${safe}`, content:b64, branch:BRANCH}; if(sha)body.sha=sha;
      const up=await fetch(`${API}/contents/${encodeURIComponent(safe)}`,{method:'PUT', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(!up.ok)throw new Error((await up.json()).message||up.status);
      await saveMeta(token,safe,{desc:document.getElementById('desc').value.trim(), cat:document.getElementById('cat').value, size:file.size});
      msg('<span class="ok">✅ 已进仓库，直链不变</span>'); busy(100); setTimeout(()=>busy(0),500);
      document.getElementById('file').value=''; setTimeout(render,1500);
    }catch(e){msg(`<span class="err">❌ ${e.message}</span>`); busy(0)} btn.disabled=false;
  }; reader.readAsDataURL(file);
}
async function saveMeta(token,name,obj){
  let meta={}, sha=null;
  try{const r=await fetch(`${API}/contents/.meta.json?ref=${BRANCH}`,{headers:auth(token)}); if(r.ok){const j=await r.json();sha=j.sha;meta=JSON.parse(atob(j.content))}}catch{}
  meta[name]={...meta[name],...obj};
  await fetch(`${API}/contents/.meta.json`,{method:'PUT', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify({message:'📝 更新简介', content:btoa(unescape(encodeURIComponent(JSON.stringify(meta,null,2)))), branch:BRANCH, ...(sha?{sha}:{})})});
}
window.delFile=async(name,sha)=>{ if(!confirm('从仓库删掉 '+name+'？'))return; const token=pat(); if(!token)return; await fetch(`${API}/contents/${encodeURIComponent(name)}`,{method:'DELETE', headers:{...auth(token),'Content-Type':'application/json'}, body:JSON.stringify({message:`🗑️ 删除 ${name}`, sha, branch:BRANCH})}); msg('<span class="ok">已删除</span>'); setTimeout(render,1500)};
document.getElementById('q').oninput=render; render();
</script>
</body>
</html>
