<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC 文件库</title>
<style>
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#050914 0%,#0d1117 100%);color:#eaf3ff;min-height:100vh;padding:20px}
  .container{max-width:820px;margin:0 auto}
  h1,h2{margin:0 0 10px;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  input,select{font:14px "Segoe UI",system-ui,sans-serif;color:#eaf3ff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;width:100%;margin-bottom:10px;outline:none;box-sizing:border-box}
  input:focus,select:focus{border-color:#62c427;box-shadow:0 0 0 3px rgba(98,196,39,.18)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .server-addr{font-size:30px;letter-spacing:1px}
  #list{margin-top:6px}
  .file-item{display:flex;justify-content:space-between;align-items:center}
  .file-name{font-size:15px}.file-meta{font-size:12px;opacity:.7;margin-top:3px}
  @media(max-width:560px){.row{flex-direction:column}.server-addr{font-size:22px}}
</style>
</head>
<body>
<div class="container">

  <div class="server-block">
    <h1>🏰 MC 服务器</h1>
    <div class="server-addr" id="svr-addr">mc.cross17.icu</div>
    <div style="margin-top:12px"><button>📋 复制地址</button></div>
  </div>

  <div class="panel">
    <h2>⬆ 上传文件</h2>
    <div class="mcf-drop" id="dropZone">
      <div class="mcf-drop-icon">📦</div>
      <div class="mcf-drop-title">拖拽文件到这儿 · 或点我选择</div>
      <div class="mcf-drop-sub">≤100MB 直传；超大整合包请解锁管理员后开启分卷</div>
      <div class="row" style="margin-top:12px;max-width:420px;margin-left:auto;margin-right:auto">
        <select id="cat"><option>其他</option><option>启动器</option><option>整合包</option><option>模组</option><option>地图</option><option>材质</option></select>
        <input type="text" id="desc" placeholder="简介（如 pcl2）">
      </div>
      <input type="file" id="file" style="display:none">
    </div>
    <div class="mcf-row" id="splitRow">
      <label class="mcf-switch">
        <input type="checkbox" id="splitMode"><span class="mcf-slider"></span>
        <span class="mcf-switch-label">🧩 超大文件分卷上传（自动切 90MB/卷）</span>
      </label>
    </div>
    <div class="row" style="margin-top:4px">
      <input type="password" id="token" placeholder="GitHub Token（repo 权限，仅存本机）">
      <button id="uploadBtn">⛏️ 上传</button>
    </div>
  </div>

  <div class="panel">
    <h2>📁 文件列表</h2>
    <input type="text" id="q" placeholder="🔍 搜索文件名 / 分类 / 简介…">
    <div id="dlBar" class="mcf-bar mcf-panel" style="display:none;margin:10px 0">
      <span class="mcf-bar-txt">📥 已选 <b id="selCnt">0</b> 个</span>
      <button class="mcf-btn primary" id="batchDl">⬇ 下载选中</button>
      <button class="mcf-btn" id="selAll">全选</button>
      <button class="mcf-btn" id="selClear">清空</button>
    </div>
    <div id="list">加载中...</div>
  </div>

</div>

<!-- 站点核心逻辑：API / 渲染。删除已移除，文件换血走 sync.py / sync.sh -->
<script>
  const OWNER = 'chachacha1437god', REPO = 'mc-files', BRANCH = 'main';
  const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;
  const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
  const PROT = ['index.html', 'beautify.js', '.meta.json', 'README.md', 'LICENSE'];
  const pat = () => document.getElementById('token').value.trim();
  const auth = t => ({ 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' });
  const utoa = s => new TextEncoder().encode(s);
  const atou = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));

  async function getMeta(){
    try{ const r = await fetch(`${API}/.meta.json?ref=${BRANCH}`);
      if (!r.ok) return {}; return JSON.parse(atou((await r.json()).content)); }
    catch (e){ return {}; }
  }

  // 渲染：只负责拉数据 + 拼原始 HTML，UI 细节交给 beautify.js 装饰
  async function render(){
    const list = document.getElementById('list');
    const q = document.getElementById('q').value.trim().toLowerCase();
    list.innerHTML = '<div class="mcf-empty">⏳ 加载中...</div>';
    const tree = await (await fetch(`${API}?ref=${BRANCH}`)).json();
    const meta = await getMeta();
    let files = tree.filter(f => f.type === 'file' && !PROT.includes(f.name) && f.size > 0);
    // 分卷卷不单独占行，由装饰层按 meta.split 归组
    files.sort((a, b) => (meta[b.name]?.time || 0) - (meta[a.name]?.time || 0));
    if (q) files = files.filter(f => {
      const m = meta[f.name] || {};
      return f.name.toLowerCase().includes(q) || (m.cat || '').includes(q) || (m.desc || '').includes(q);
    });
    if (!files.length){ list.innerHTML = '<div class="mcf-empty">🎒 这里空空的，丢个整合包进来吧</div>'; return; }
    list.innerHTML = files.map(f => {
      const m = meta[f.name] || {};
      const isVol = /\.part\d{2}\.zip$/i.test(f.name);
      return `<div class="file-item" data-name="${f.name}">
        <div style="min-width:0">
          <div class="file-name">${f.name}</div>
          <div class="file-meta">${(f.size/1024/1024).toFixed(1)}MB · ${m.cat||'其他'}${m.desc?(' · '+m.desc):''}</div>
        </div>
        <div class="file-actions">
          <a class="mcf-raw-link" href="${RAW}/${f.name}" target="_blank" rel="noopener"></a>
        </div>
      </div>`;
    }).join('');
    // 删除功能已彻底移除：无删除按钮、无 DELETE 请求、无 delFile 全局。
    // 文件条目里的链接/镜像/分卷标统一由 beautify.js 的 dress() 渲染。

  document.getElementById('q').addEventListener('input', () => { if (typeof render === 'function') render(); });
  render(); // beautify.js 会包装 render，若时序更早则由 beautify 的 fixBoot 补装饰
</script>

<!-- UI / 鉴权层：独立文件，改样式不用碰上面 -->
<script src="beautify.js"></script>
</body>
</html>
